<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gob UI — Vanilla</title>

    <!-- En un server estático con node_modules accesible, estos imports funcionan tal cual.
         Si usas Vite u otro bundler, importa desde tu pipeline. -->
    <link rel="stylesheet" href="../../packages/styles/src/base.css" />
    <link rel="stylesheet" href="../../packages/styles/src/theme.css" />
    <link rel="stylesheet" href="../../packages/styles/src/utilities.css" />

    <script type="module" src="../../packages/ui-wc/dist/gob-ui.js"></script>
  </head>
  <body>
    <main class="gob-container gob-stack">
      <h1 style="margin:0;font-size:28px">Gob UI — Vanilla</h1>
      <p class="gob-muted" style="margin-top:8px">Mismo botón, cero framework.</p>

      <div class="gob-row">
        <gob-button variant="primary">Guardar</gob-button>
        <gob-button variant="secondary">Cancelar</gob-button>
        <gob-button variant="ghost">Ver</gob-button>
      </div>
    </main>
  </body>
</html>
